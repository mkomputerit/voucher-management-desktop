name: Build Windows portable

on:
  push:
    branches:
      - main
      - public-readiness
      - 'beta/**'
      - 'release/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'launcher.py'
      - 'tools/**'
      - 'third_party_licenses/**'
      - 'requirements*.txt'
      - 'pyinstaller.spec'
      - 'version.txt'
      - 'windows_version_info.txt'
      - 'README.md'
      - 'LICENSE'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_SIGNING_POLICY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    # Pin the runner family used by the reviewed build instead of following
    # the moving windows-latest alias.
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install pip==26.2.1
          .\.venv\Scripts\python.exe -m pip install --require-hashes --no-deps -r requirements-lock.txt
          .\.venv\Scripts\python.exe -m pip check

      - name: Verify Pillow Windows integrations
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "from PIL import Image, ImageTk, ImageWin; image=Image.new('RGB',(2,2),'white'); ImageWin.Dib(image); print('Pillow', Image.__version__, 'ImageTk/ImageWin.Dib OK')"

      - name: Audit locked dependencies
        shell: pwsh
        run: |
          $auditVenv = Join-Path $env:RUNNER_TEMP "voucher-management-audit"
          python -m venv $auditVenv
          $auditPython = Join-Path $auditVenv "Scripts\python.exe"
          $auditExe = Join-Path $auditVenv "Scripts\pip-audit.exe"
          & $auditPython -m pip install pip-audit==2.10.1
          # CVE-2025-71176 affects pytest tmpdir handling on Unix. This
          # workflow runs the reviewed test/build environment on Windows.
          & $auditExe -r requirements-lock.txt --no-deps --disable-pip --ignore-vuln CVE-2025-71176

      - name: Compile source
        env:
          PYTHONPATH: src
        run: .\.venv\Scripts\python.exe -m compileall -q src launcher.py

      - name: Check generic engineering privacy
        run: .\.venv\Scripts\python.exe tools/check_public_tree.py

      - name: Build and verify clean public snapshot
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\export_public_snapshot.py build\public-snapshot
          .\.venv\Scripts\python.exe tools\check_public_tree.py --root build\public-snapshot --public-export

      - name: Run tests
        env:
          PYTHONPATH: src
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Prepare privacy markers
        shell: pwsh
        env:
          PUBLIC_PRIVACY_MARKERS: ${{ secrets.PUBLIC_PRIVACY_MARKERS }}
        run: |
          $markerFile = Join-Path $env:RUNNER_TEMP "voucher-management-privacy-markers.txt"
          [System.IO.File]::WriteAllText($markerFile, $env:PUBLIC_PRIVACY_MARKERS)
          "PRIVACY_MARKERS_FILE=$markerFile" >> $env:GITHUB_ENV

      - name: Check deployment markers in source tree
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\check_public_tree.py --markers-file "$env:PRIVACY_MARKERS_FILE" --require-markers

      - name: Check deployment markers in public snapshot
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\check_public_tree.py --root build\public-snapshot --public-export --markers-file "$env:PRIVACY_MARKERS_FILE" --require-markers

      - name: Validate PowerShell diagnostics
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.Name)"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build portable onedir
        run: .\.venv\Scripts\pyinstaller.exe --noconfirm --clean pyinstaller.spec

      - name: Test shared Windows installer and ACLs
        shell: pwsh
        run: .\tools\Test-WindowsSharedInstall.ps1 -SourcePath .\dist\VoucherManagement

      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content version.txt -Raw).Trim()
          $info = (Get-Item dist\VoucherManagement\VoucherManagement.exe).VersionInfo
          $checks = @{
            ProductName = "Voucher Management"
            FileDescription = "Voucher Management"
            OriginalFilename = "VoucherManagement.exe"
            ProductVersion = $expectedVersion
            FileVersion = $expectedVersion
          }
          foreach ($name in $checks.Keys) {
            $actual = $info.$name
            $expected = $checks[$name]
            if ($actual -ne $expected) {
              throw "Windows metadata mismatch for ${name}: expected '$expected', got '$actual'"
            }
          }

          $bundleIcon = "dist\VoucherManagement\_internal\assets\VoucherManagement.ico"
          if (-not (Test-Path -LiteralPath $bundleIcon -PathType Leaf)) {
            throw "Bundled application icon is missing: $bundleIcon"
          }
          if ((Get-Item -LiteralPath $bundleIcon).Length -le 0) {
            throw "Bundled application icon is empty: $bundleIcon"
          }

          .\.venv\Scripts\python.exe tools\verify_exe_icon.py --exe dist\VoucherManagement\VoucherManagement.exe --ico $bundleIcon

          $fontRoot = "dist\VoucherManagement\_internal\assets\fonts"
          foreach ($font in @("NotoSans-Regular.ttf", "NotoSans-Bold.ttf", "NotoSans-Italic.ttf")) {
            $fontPath = Join-Path $fontRoot $font
            if (-not (Test-Path -LiteralPath $fontPath -PathType Leaf)) {
              throw "Bundled Unicode PDF font is missing: $fontPath"
            }
            if ((Get-Item -LiteralPath $fontPath).Length -le 0) {
              throw "Bundled Unicode PDF font is empty: $fontPath"
            }
          }

      - name: Add release documentation and dependency inventory
        shell: pwsh
        run: |
          Copy-Item version.txt dist\VoucherManagement\version.txt
          Copy-Item README.md dist\VoucherManagement\README.md
          Copy-Item LICENSE dist\VoucherManagement\LICENSE
          Copy-Item PRIVACY.md dist\VoucherManagement\PRIVACY.md
          Copy-Item THIRD_PARTY_NOTICES.md dist\VoucherManagement\THIRD_PARTY_NOTICES.md
          New-Item -ItemType Directory -Force dist\VoucherManagement\docs | Out-Null
          Copy-Item docs\ARCHITECTURE.md dist\VoucherManagement\docs\ARCHITECTURE.md
          Copy-Item SECURITY.md dist\VoucherManagement\SECURITY.md
          Copy-Item tools\Install-VoucherManagement.ps1 dist\VoucherManagement\Install-VoucherManagement.ps1
          Copy-Item tools\Uninstall-VoucherManagement.ps1 dist\VoucherManagement\Uninstall-VoucherManagement.ps1
          .\.venv\Scripts\python.exe -m pip freeze --all | Out-File -Encoding utf8 dist\VoucherManagement\DEPENDENCIES.txt
          .\.venv\Scripts\python.exe tools\collect_dependency_licenses.py dist\VoucherManagement\THIRD_PARTY_LICENSES
          New-Item -ItemType Directory -Force dist\VoucherManagement\THIRD_PARTY_LICENSES\pypdfium2 | Out-Null
          Copy-Item third_party_licenses\pypdfium2\* dist\VoucherManagement\THIRD_PARTY_LICENSES\pypdfium2\ -Force
          New-Item -ItemType Directory -Force dist\VoucherManagement\THIRD_PARTY_LICENSES\noto-sans | Out-Null
          Copy-Item third_party_licenses\noto-sans\OFL.txt dist\VoucherManagement\THIRD_PARTY_LICENSES\noto-sans\OFL.txt -Force
          Get-FileHash dist\VoucherManagement\VoucherManagement.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  VoucherManagement.exe" } |
            Out-File -Encoding ascii dist\VoucherManagement\SHA256SUMS.txt

      - name: Package public release files
        if: github.event.repository.private == false && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Public stable release requires a stable SemVer X.Y.Z version: $version"
          }
          $archive = "VoucherManagement-$version-Windows-x64.zip"
          Compress-Archive -Path dist\VoucherManagement\* -DestinationPath $archive -CompressionLevel Optimal
          $zipHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $archive" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload public release files
        if: github.event.repository.private == false && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoucherManagement-release-${{ github.sha }}
          path: |
            VoucherManagement-*-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable build
        # Normal development pushes are still fully compiled/tested, but the
        # ~28 MB portable ZIP is retained only when explicitly requested or
        # when building a release/main branch. This prevents Actions artifact
        # storage from growing on every review commit.
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoucherManagement-Windows-x64-${{ github.sha }}
          path: dist/VoucherManagement/
          if-no-files-found: error
          retention-days: 14


  release:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: VoucherManagement-release-${{ github.sha }}
          path: release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$(find release-files -maxdepth 1 -type f -name 'VoucherManagement-*-Windows-x64.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "Release archive not found"
            exit 1
          fi
          base="$(basename "$archive")"
          version="${base#VoucherManagement-}"
          version="${version%-Windows-x64.zip}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version: $version"
            exit 1
          fi
          (
            cd release-files
            sha256sum -c SHA256SUMS.txt
          )
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published assets"
            exit 1
          fi
          gh release create "$tag" \
            "$archive" \
            release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voucher Management $version" \
            --notes "Voucher Management $version. See CHANGELOG.md in the repository for release details. Built and verified by the public GitHub Actions workflow."

